// Build script cấp gốc — cấu hình dùng chung cho mọi module.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 7.4.2 + Gradle 7.5: khớp SampleApp của Keenon, đã có sẵn trong cache Gradle máy này.
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
